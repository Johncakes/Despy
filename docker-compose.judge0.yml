# ──────────────────────────────────────────────────────────────────────
# docker-compose.judge0.yml — 로컬 Judge0 채점 엔진 (MVP용)
#
# despy 채점(/api/judge)이 호출할 Judge0 인스턴스를 로컬에 띄운다.
# 실행:  docker compose -f docker-compose.judge0.yml up -d
# 확인:  curl http://localhost:2358/about
# 끄기:  docker compose -f docker-compose.judge0.yml down
#
# 띄운 뒤 .env.local 에 JUDGE0_URL="http://localhost:2358" 를 넣으면
# 모의 채점 대신 실제 채점으로 전환된다. (자세히: docs/judge0.md)
#
# ⚠️ Judge0는 privileged 컨테이너 + cgroup 접근이 필요해 Apple Silicon(macOS)
#    에서는 동작이 불안정할 수 있다. 어려우면 개발 중에는 모의 채점을 쓰고,
#    채점은 Linux 호스트/클라우드에서 검증하는 것을 권장한다.
# ──────────────────────────────────────────────────────────────────────

services:
  server:
    image: judge0/judge0:1.13.1
    restart: always
    privileged: true
    ports:
      - "2358:2358"
    environment:
      - REDIS_HOST=redis
      - REDIS_PASSWORD=judge0redis
      - POSTGRES_HOST=db
      - POSTGRES_DB=judge0
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=judge0pass
    depends_on:
      - db
      - redis

  workers:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    restart: always
    privileged: true
    environment:
      - REDIS_HOST=redis
      - REDIS_PASSWORD=judge0redis
      - POSTGRES_HOST=db
      - POSTGRES_DB=judge0
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=judge0pass
    depends_on:
      - db
      - redis

  db:
    image: postgres:13
    restart: always
    environment:
      - POSTGRES_DB=judge0
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=judge0pass
    volumes:
      - judge0-db:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--requirepass", "judge0redis"]

volumes:
  judge0-db:
